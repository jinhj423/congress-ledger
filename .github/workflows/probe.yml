name: probe
on:
  push:
    branches: [claude/project-thread-5ypc9d]
    paths: [probe/**, .github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pdfplumber
      - run: python probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: out/ }
      - name: Push samples to probe-out branch
        run: |
          cd out && git init -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -qm "probe samples"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
