name: probe
on:
  push:
    branches: [claude/project-thread-5ypc9d]
    paths: [probe/**, .github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pdfplumber
      - run: python probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: out/ }
